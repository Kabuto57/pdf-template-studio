<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Ops Workbench</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Demo internal workbench: open emailed trade application PDFs and read their data.">
</head>
<body class="ops">
  <header class="ops-head"><b>Trade Operations Workbench</b><span class="badge">Internal · demo</span><span class="who"><a href="index.html">Back to the demo</a></span></header>
  <div class="ops-main">
    <aside class="inbox">
      <div class="inbox-head"><b>Inbox</b><span class="muted small" id="count"></span></div>
      <div class="inbox-list" id="inbox"></div>
      <label class="drop" id="drop" for="pdfIn">Got the PDF by real email?<br><b>Drop it here</b> or click to choose<input type="file" id="pdfIn" accept="application/pdf,.pdf" class="sr"></label>
    </aside>
    <main class="work" id="work"><div class="empty-state"><h2>No application open</h2><p>Choose an email on the left, or drop a PDF.</p></div></main>
  </div>
  <script type="module" src="/src/ops.ts"></script>
</body>
</html>
