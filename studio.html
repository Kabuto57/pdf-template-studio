<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Template Studio</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Design a fillable PDF form, fill it, and pull the answers back out as JSON. Your files never leave your browser.">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>PDF Template Studio</div>
    <nav class="steps" aria-label="Steps">
      <button type="button" data-view="design" aria-selected="true"><span class="n">1</span>Design</button>
      <button type="button" data-view="fill" aria-selected="false"><span class="n">2</span>Fill</button>
      <button type="button" data-view="extract" aria-selected="false"><span class="n">3</span>Extract</button>
    </nav>
    <div class="actions">
      <select id="templateSel" aria-label="Form">
        <option value="">Open a form…</option>
        <optgroup label="Bank trade forms" id="bankForms"></optgroup>
        <optgroup label="Other">
          <option value="guarantee">Simple banker's guarantee (sample)</option>
          <option value="blank">Blank form</option>
          <option value="open">Upload a PDF template…</option>
        </optgroup>
      </select>
      <input type="file" id="templateIn" accept="application/pdf,.pdf" class="sr" tabindex="-1">
      <details class="sample-files"><summary>Sample filled PDFs</summary><div><a href="samples/LC-TanEngineering.pdf" download>LC-TanEngineering.pdf</a><a href="samples/LC-LimBrothers.pdf" download>LC-LimBrothers.pdf</a><a href="samples/LC-OceanicFoods.pdf" download>LC-OceanicFoods.pdf</a><a href="samples/LC-SunriseElectronics.pdf" download>LC-SunriseElectronics.pdf</a><a href="samples/LC-GlobalWidgets.pdf" download>LC-GlobalWidgets.pdf</a><a href="samples/LC-TanEngineering-2.pdf" download>LC-TanEngineering-2.pdf</a><a href="samples/LC-LimBrothers-printed.pdf" download>LC-LimBrothers-printed.pdf</a><a href="samples/LC-OceanicFoods-2.pdf" download>LC-OceanicFoods-2.pdf</a></div></details>
      <button type="button" id="codeBtn">View code</button>
      <button type="button" id="blankBtn">Download blank PDF</button>
      <button type="button" id="saveBtn" class="primary">Save filled PDF</button>
    </div>
  </header>
  <main class="main">
    <div class="panel" id="panel"></div>
    <div id="preview" role="img" aria-label="PDF preview"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
